name: build firmware

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer les dépendances
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3

      - name: Installer les dépendances Python
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install Pillow
      
      - name: Télécharger le toolchain JieLi
        run: |
          chmod +x tools/get_toolchain.sh
          ./tools/get_toolchain.sh
          ls -la /home/runner/.jieli/toolchain
          
      - name: Lancer build.sh
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Publier le firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: build/
