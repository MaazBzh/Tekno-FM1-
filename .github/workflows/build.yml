name: build firmware

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer les dépendances
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3

      - name: Installer le toolchain JieLi
        run: |
          # À adapter : URL ou archive du toolchain pi32v2 / SDK AC791N
          # Vérifie d'abord le README du dépôt pour la source officielle.
          echo "TODO: télécharger et extraire le toolchain"
          # exemple : curl -L -o toolchain.zip "URL" && unzip toolchain.zip -d $HOME/jieli
      - name: Installer les dépendances Python
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install Pillow
          
      - name: Lancer build.sh
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Publier le firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: build/
